name: Sim Leak MacOS

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  api-simulation-leak-tests-macos:
    name: Simulation Leak Tests MacOS
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Run simulation leak tests
      run: |
        make clean node_sim_memory

