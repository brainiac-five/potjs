name: Sim Leak Ubuntu

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  api-simulation-leak-tests:
    name: Simulation Leak Tests Ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Set up zsh
      run: |
        sudo apt-get remove --purge man-db
        sudo apt-get -y install zsh

    - name: Run simulation leak tests
      run: |
        make clean node_sim_memory

