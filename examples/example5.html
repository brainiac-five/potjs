<script src="lib/wasm_exec.js"></script>
<script src="lib/potjs.js" wasm="lib/pot.wasm"></script>

<script>

(async () => {

	await pot.ready()

	map = await pot.new("http://localhost:1633", "fdbd07748459940c2e878c0f0fd70037a076e0f8264393af18887aacf29d9e6c")

	await map.put("hello", "POT!")

	value = await map.get("hello")

	console.log("key ‹hello› has:", value)

	ref = await map.save()

	console.log("tree root is:", ref)

})()

</script>
