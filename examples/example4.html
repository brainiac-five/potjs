<pre>


	POT JS Example 4: Synchronous

	Check source and console.


	This page uses synchronous calls that can be helpful for prototyping
	but don't work for network connections (only in-memory, i.e using
	newSync() without parameters) and not for use with node. Wrong use
	will just reliably deadlock.


	<img src=favicon.ico>


</pre>

<script src="lib/pot-web.js" wasm="lib/pot.wasm"></script>

<script>

function onWasmLoaded() {

	map = pot.newSync()

	map.putSync("hello", "POT!")

	value = map.getSync("hello")

	console.log("key ‹hello› has:", value)
}

</script>
