<pre>


	POT JS Example 2: Interactive, Verbosity, Path, Integrity


	key     <input id=key>

	value   <input id=value>

		<button onclick="put()"> put </button>


<hr />


	key     <input id=search>

		<button onclick="get()"> get </button>

	value   <input id=result>


	<img src=favicon.ico>


</pre>

<script src="lib/pot-web.js" wasm="lib/pot.wasm" verbosity="3" integrity="sha384-0mkr3ak+/j2TU8rvuzOPgwEVk5Xo+oVmDM3jn8HkWtTyJjf/7BoJE3LzDYmJes6K"></script>

<script>

	var kvs

	(async () => {

		await pot.ready()
		kvs = await pot.new()

	})()

	const field = (id) => { return document.getElementById(id) }

	async function put() {

		key = field('key').value
		value = field('value').value
		await kvs.put(key, value)
	}

	async function get() {

		key = field('search').value
		value = await kvs.get(key)
		field('result').value = value
	}

</script>
