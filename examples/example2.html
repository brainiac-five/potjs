<pre>


	POT JS Example 2: Interactive & Integrity


	key    <input id=key>

	value  <input id=value>

	       <button onclick="put()"> put </button>


<hr />


	key    <input id=search>

	       <button onclick="get()"> get </button>

	value  <input id=result>


	<img src=favicon.ico>


</pre>

<script src="lib/pot-web.js" wasm="lib/pot.wasm" verbosity="3" integrity="sha384-/Oi1K5TxOi1stt6HEliKlJZk3iS9wXM8VHcf32YThWlH7QxPGR42/KclauxTPRcn"></script>

<script>

	var map

	(async () => {

		await pot.ready()
		map = await pot.new()

	})()

	const field = (id) => { return document.getElementById(id) }

	async function put() {

		key = field('key').value
		value = field('value').value
		await map.put(key, value)
	}

	async function get() {

		key = field('search').value
		value = await map.get(key)
		field('result').value = value
	}

</script>
