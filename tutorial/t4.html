<script src="potjs/lib/pot-web.js" verbosity=2></script>

<script>

; (async () => {

	await pot.ready()
	kvs = new pot.Kvs()
	await kvs.put("hello", "P.O.T.")
	value = await kvs.get("hello")
	console.log("hello:", value)

	ref = await kvs.save()
	console.log("save reference:", ref)

	await kvs.put("Hogy vagy", "Viktor")
	value = await kvs.get("Hogy vagy")
	console.log("Hogy vagy:", value)

	ref = await kvs.save()
	console.log("save reference:", ref)

	await kvs.delete("Hogy vagy")
	value = await kvs.get("Hogy vagy")
	console.log("Hogy vagy:", value)

	ref = await kvs.save()
	console.log("save reference:", ref)
})()

</script>
