<pre>

	key     <input id=key>

	value   <input id=value>

		<button onclick="put()"> put </button>
</pre>

<script src="potjs/lib/pot-web.js"></script>

<script>

	var kvs

	(async () => {
		await pot.ready()
		kvs = await pot.new()
	})()

	async function put() {
		key = document.getElementById('key').value
		value = document.getElementById('value').value
		await kvs.put(key, value)
	}

</script>
